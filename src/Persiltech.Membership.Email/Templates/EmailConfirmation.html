<h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#212529;">
  Hola, {{FirstName}}
</h1>

<p style="margin:0 0 16px;">
  Ya casi está. Confirma que <strong>{{Email}}</strong> es tu correo para terminar de
  activar tu cuenta en {{BrandName}}.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:6px;background-color:{{PrimaryColor}};">
      <a href="{{ActionUrl}}"
         style="display:inline-block;padding:12px 28px;color:#ffffff;text-decoration:none;
                font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;">
        Confirmar mi correo
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px;font-size:13px;color:#6c757d;">
  Si el botón no funciona, copia esta dirección en tu navegador:
</p>
<p style="margin:0;font-size:13px;word-break:break-all;">
  <a href="{{ActionUrl}}" style="color:{{PrimaryColor}};">{{ActionUrl}}</a>
</p>
