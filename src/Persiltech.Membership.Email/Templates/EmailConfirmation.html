<h1 class="titulo texto" style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:bold;color:#1f2329;">
  Hola, {{FirstName}}
</h1>

<p style="margin:0 0 20px;">
  Ya casi está. Confirma que <strong>{{Email}}</strong> es tu correo para terminar de activar
  tu cuenta en {{BrandName}}.
</p>

<!-- Boton a prueba de Outlook: el de escritorio usa el motor de Word, que no entiende
     border-radius ni el relleno de un inline-block, y dejaria el rotulo como texto suelto.
     La version VML de dentro del condicional es la que ve Outlook; el resto de clientes ven
     el enlace de despues. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td>
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                   href="{{ActionUrl}}" style="height:48px;v-text-anchor:middle;width:260px;" arcsize="14%"
                   stroke="f" fillcolor="{{PrimaryColor}}">
        <w:anchorlock/>
        <center style="color:{{OnPrimaryColor}};font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">
          Confirmar mi correo
        </center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-- -->
      <a class="boton" href="{{ActionUrl}}"
         style="display:inline-block;padding:14px 32px;border-radius:6px;background-color:{{PrimaryColor}};color:{{OnPrimaryColor}};font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;line-height:1.2;text-decoration:none;">
        Confirmar mi correo
      </a>
      <!--<![endif]-->
    </td>
  </tr>
</table>

<p class="texto-tenue" style="margin:0 0 8px;font-size:13px;color:#5b6470;">
  Si el botón no funciona, copia esta dirección en tu navegador:
</p>
<p style="margin:0;font-size:13px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere;">
  <a href="{{ActionUrl}}" style="color:{{PrimaryColor}};">{{ActionUrl}}</a>
</p>
