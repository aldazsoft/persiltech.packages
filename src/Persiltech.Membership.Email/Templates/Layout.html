<!DOCTYPE html>
<html lang="{{Language}}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Se declaran los dos esquemas para que el cliente respete estos colores en modo oscuro
       en lugar de invertirlos por su cuenta, que es lo que deja texto oscuro sobre fondo
       oscuro. Lo que no se pueda evitar se corrige en la media query de abajo. -->
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{Preheader}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    /* Outlook de escritorio ignora <style>, asi que aqui solo va lo que mejora al resto y
       cuya ausencia no rompe nada. */
    a { text-decoration: underline; }

    @media only screen and (max-width: 620px) {
      .contenedor { width: 100% !important; }
      /* Menos aire lateral en movil: con 24px a cada lado, una pantalla estrecha deja el
         texto en una columna demasiado angosta. */
      .relleno-lateral { padding-left: 20px !important; padding-right: 20px !important; }
      .titulo { font-size: 22px !important; line-height: 1.25 !important; }
      /* El boton pasa a ocupar el ancho: en una pantalla tactil es el objetivo mas facil
         de acertar, y evita que quede huerfano a la izquierda. */
      .boton { display: block !important; width: 100% !important; text-align: center !important; }
    }

    @media (prefers-color-scheme: dark) {
      .lienzo { background-color: #14161a !important; }
      .tarjeta { background-color: #1e2126 !important; }
      .texto { color: #e6e8eb !important; }
      .texto-tenue { color: #a6acb5 !important; }
      .pie { background-color: #191c21 !important; border-top-color: #2b2f36 !important; }
      .aviso { background-color: #232830 !important; }
    }
  </style>
</head>
<body class="lienzo" style="margin:0;padding:0;width:100%;background-color:#eef0f4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

  <!-- Adelanto: es lo que el cliente muestra junto al asunto en la bandeja. Los espacios
       invisibles que lo siguen impiden que se cuele detras el principio del cuerpo. -->
  <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">
    {{Preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="lienzo" style="background-color:#eef0f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!--[if mso]>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="contenedor tarjeta"
               style="width:100%;max-width:600px;background-color:#ffffff;border-radius:10px;overflow:hidden;">

          <tr>
            <td class="relleno-lateral" style="padding:22px 24px;background-color:{{PrimaryColor}};">
              {{BrandHeader}}
            </td>
          </tr>

          <tr>
            <td class="relleno-lateral texto"
                style="padding:32px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#1f2329;">
              {{Body}}
            </td>
          </tr>

          <tr>
            <td class="relleno-lateral pie texto-tenue"
                style="padding:20px 24px;background-color:#f6f7f9;border-top:1px solid #e4e7ec;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#5b6470;">
              <p style="margin:0 0 6px;">
                Este es un mensaje automático de {{BrandName}}. No hace falta responder.
              </p>
              <p style="margin:0;">
                &copy; {{Year}} {{BrandName}}{{SupportLine}}
              </p>
            </td>
          </tr>

        </table>

        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
